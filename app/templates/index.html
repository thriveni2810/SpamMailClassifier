<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email/SMS Spam Classifier</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>Email/SMS Spam Classifier</h1>

        <br><br>

        <form action="/predict" method="post">

            <label>
                <b>Enter the message</b>
            </label>

            <textarea name="message" rows="10" placeholder="Type your email or SMS here..." required>
        </textarea>

            <button type="submit">

                Predict

            </button>

        </form>

    </div>

</body>

</html>
